name: Same-day alerts (Team)

on:
  schedule:
    - cron: "40 16 * * 2-5"   # Tuesday to Friday, 16:40 UTC (late afternoon UK time); Mondays are covered by the brief
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Only print what would be sent (no emails)"
        type: boolean
        default: true

concurrency:
  group: momentum
  cancel-in-progress: false

jobs:
  alerts:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Find and email same-day alerts
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then python3 scripts/instant.py --dry-run; else python3 scripts/instant.py; fi
